[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "074f30d1bbcf643313a8355d37347925b317b36f" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "c5f367a8483ff236549b0576ed77bd33ed442f79" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "eda8191f16bb51c30ff5c38b4e75aad2a0180d7f" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "44d046359536ce612b5ff521577bcf7b69df74ca" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "f9142772e7db8bf5a1e94664822eff806fc98184" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "94f57172a40635025253fc4c3710323a968d08c4" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
