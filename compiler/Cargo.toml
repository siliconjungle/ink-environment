[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "ab2b8febed1301a68d1bad3f52a1c7818d775f58" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "968f1add3e1459928e740fae6dce0a3ae6059da9" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "78dbae3023b828b6dc302d66803407759860ef73" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "cf63b214db34ba4efdc561cbb9842bc04a541708" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "19e964f2ca98f80322486452ec6ed1c6ad4e5314" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "d948c2985e1aaec5ab2061056d65ea4d8ebaf3b9" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
