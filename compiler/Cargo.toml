[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "b766998ad619dede0fef957f96dd1e0327faf3f7" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "a254a8e132dbc0f5580f3736a28839860e6247a0" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "10f9a549c6e99e477d81e747f5926e21c709edfa" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "6e0f261b88eee4f3d971da95916e036c849e29aa" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "004389520708b23a7d36e4773312875b372b0f88" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "972229604ac4787fc47e02f56831f614d7d42eaa" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
