[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "b766998ad619dede0fef957f96dd1e0327faf3f7" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "b8c36c37197190430fe70340d72c68b6a1989123" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "b55332a00f4f4f12625ad1018554869826504984" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "f4c9fa63048282b3a28663cd7072ca724631361e" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "fd51fdd7283584d5e7cfefef79cb4a171031a1fe" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "5aa034af23d1568e3a0c5bfa9119ccc8b9b99f45" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
