[package]
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "2fb9b87679635c646417c1f906c7363485621008" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "58a157213f767ece00c63769a6b429eadfebec0c" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "d5fb3080f7b7a54017db9d19c80e7d87d653860d" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "8b9fc7f130f0356cdaff8f5822cf6eb7429e9343" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "29d247e66baed6c00302da48f75ca2c406ee7017" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "c800d60a4f49790dced13fc930b84ba7815d60a0" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
