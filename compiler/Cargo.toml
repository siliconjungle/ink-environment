[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "b766998ad619dede0fef957f96dd1e0327faf3f7" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "f720ae20c1f4ac7f6ab644d6a40f4b2373190fa3" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "32d9d3a5a1c5030ce4add6f8dfd4db038c3b0d1d" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "829f3e19d2f8a59224db7d689bceffeca40286b9" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "59c91150ffbfae9165d607fda798ba40538f792e" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "49ea0934f9112a355fb7bdb9143032446b56f243" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
