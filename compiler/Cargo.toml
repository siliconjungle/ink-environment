[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "8de6fd78459f67f96084e1f509227c9393ef4439" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "d877661369f2baa82e494713b5147e075dc487d4" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "8930ae3191141977b416b07d4a23935bc2f05807" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "08c81dea7f6479ee06573192dd8b18b5edf22fe9" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "4d4771dc2e33346213561583c2c3fb98b2029228" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "90a7a93c6be095cb906601ec2b40c8a1467adbdf" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
