[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "3cc51b56db6fc4c0cd849b5c017fda716ef99028" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "5766277bc03be5526282bde100c108de8d62baf7" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "a52c85e88267204330fb06ebabfee0e903422556" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "2011f68c3061614e6279822f37d31fffd6f453a7" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "29dec0577d71cb5e50376534c94352b2be3149fb" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "8ad066eaca7ed7d7876bb3ff88414b071013b554" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
