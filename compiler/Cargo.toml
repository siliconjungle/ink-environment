[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "51af4dda101688c78f68684cf574ab613edf6c36" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "12f535564488318ba5a709dff274f2c6151e0998" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "cc3dd719106a17f14f3249712fa21514a5f38877" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "4b4edc75d678155b0ed923f9e7c27bbe118617c2" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "8ed92b356867d5e587289d18ba349fc7756cc872" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "ba66a365b4e7c2fe80fff4e7443a781f61eb9a56" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
