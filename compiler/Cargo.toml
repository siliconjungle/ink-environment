[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "b766998ad619dede0fef957f96dd1e0327faf3f7" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "1e8dd79e8eb72deecf794267c218b56286d8e958" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "6fd50e7e4119b70931289911c3adde234b673275" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "77f48a14c2c183947203c937880b2d0fac3bdb24" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "7096b55e47320284af87feddf97c4363a07ee2cb" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "4e7af56ee7c0ecc5635da11f7610f0a48a56e852" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
