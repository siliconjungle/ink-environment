[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-lowering-rust = { git = "https://github.com/siliconjungle/ink-lowering-rust", rev = "b7024687d1d2bb0f2ba4e7ae01d3f69871db3b31" }
ink-core = { path = "../.ink-source/core" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "6a4a2bee6d30c8b733d71e3f0ec3b0f5605c7f91" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "3f1080b94e3b570d3f541bc4a261f1c1f73561d2" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "1ac20047cb95fb042d45303b2a93997a89ecc06e" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "5c74c999f0852fe9f582311401f0d51905044356" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]

# Match the distribution: all lowerers consume this exact checked core.
[patch."https://github.com/siliconjungle/ink-lang"]
ink-core = { path = "../.ink-source/core" }
