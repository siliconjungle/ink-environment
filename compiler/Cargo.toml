[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "b766998ad619dede0fef957f96dd1e0327faf3f7" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "cc3f1e3abbfcab478d8db3b5ab7f7b259ae53c9e" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "cc26ef39e02a3484e7f76aa575a4556d507d98ab" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "af50580b61169a1ea75f4e3aa01da272b83d2ecd" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "d565286558a0c3df7b0338a9a09f4cf1075393db" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "6ae7c575627824c953fce86b8cc8a2cc8f492992" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
