[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-lowering-rust = { git = "https://github.com/siliconjungle/ink-lowering-rust", rev = "3ac247cf1827c90230453c0920d560f842c39172" }
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "3ce90453f57e6e2639f93ef6d1a66ba1ad13921b" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "d982bd5de13227d78adbaa0f319923c1c9fbfc9f" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "e1dce254d9dbe0e93a0f2dc728182a1f230cb9df" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "bf32ee386de71411c570d2958e4c657ce77c02e5" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "5c74c999f0852fe9f582311401f0d51905044356" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
