[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "1ea51cf4402bfd93b2ca99547e9ecd6489e58b35" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "9afbe634721573e85fabaab471c7a06215c39dc7" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "317286e9d367ac16af208c8405210ca7cfa14c03" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "578347f5da0e5d97beaf92fd8e6b0876e766116d" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "f3debca247b3294b1ed221cfb16cc3444cea0395" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "b7c883b4b17db6ae5d1d8b4f27caf137500d30a0" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
