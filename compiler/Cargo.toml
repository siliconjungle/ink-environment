[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-lowering-rust = { git = "https://github.com/siliconjungle/ink-lowering-rust", rev = "c8218c5f0df19b1ee2d4518377b97db2d2fd732d" }
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "0b0bf5ba4077b1e38a3e39051933ff3c7645b30d" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "6a4a2bee6d30c8b733d71e3f0ec3b0f5605c7f91" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "c156303654c67f0d3c040352193c24951d174bb4" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "89c67f18deea3635ea40835a0563405dc777717b" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "5c74c999f0852fe9f582311401f0d51905044356" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
