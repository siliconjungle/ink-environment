[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "32ff9b94143ecf1b25ef4063c1d5c20e3b54eb17" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "cbee6a613bbb74d1dc213e63e95bdfc540e4f067" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "377d5606bf760020ecf92acaa2cec30a305af8fb" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "c226557bfa466885134b38467e18bd597b654010" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "71470c937c9149508a5b3d979a5933e6330dd2f3" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "9129497b81007a690fd1390f03ce88d9a08fd1a8" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
