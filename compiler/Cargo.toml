[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "d3b7389074eef4c275ce7847b2fb06f6aae13997" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "21d7391dd9e2fbae0667d5c7611f035026c8b8bc" }
ink-lowering-c = { git = "https://github.com/siliconjungle/ink-lowering-c", rev = "fe0a01c2daa2e33f93a4aa58edfa2187dfa8fa2f" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "0da7ca005df7a4c7a8ad9670f4ab4735fd234968" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "953da0a02062c7e58fcb7e2c7a7c4d246a88f2f6" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "0279510f620d4057d83a9b7bdd05212754517d66" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
